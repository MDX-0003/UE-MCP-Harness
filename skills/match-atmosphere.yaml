# 参考图氛围匹配 Skill
name: match-atmosphere
description: "参考图驱动的场景氛围匹配：加载参考图 → 9 维度对比 → 按组件逐项调整 → 量化指标导航验证闭环"
triggers:
  - "参考图"
  - "参考这张图"
  - "匹配这张图"
  - "match reference"
  - "氛围"
  - "atmosphere"
  - "像这张图"
  - "match atmosphere"
  - "参考这个"
  - "调氛围"
  - "整体氛围"
  - "照着这张图"
tools_allowlist:
  # 氛围组件操作
  - "SceneTools.find_actors"
  - "SceneTools.add_to_scene_from_class"
  - "ObjectTools.list_properties"
  - "ObjectTools.get_properties"
  - "ObjectTools.set_properties"
  - "ActorTools.get_actor_transform"
  - "ActorTools.set_actor_transform"
  # 相机与截图
  - "EditorAppToolset.SetCameraTransform"
  - "EditorAppToolset.FocusOnActors"
  - "EditorAppToolset.GetCameraTransform"
  # Harness 自有工具
  - "build_atmosphere_mapping"
  - "match_reference"
  - "vision_screenshot"
  - "vision_ask"
  - "vision_tell"
  - "vision_reset"
  - "vision_status"
  - "deactivate_skill"
steps: |
  ## 参考图氛围匹配流程

  ### Step 1 — 生成参数映射
  调 build_atmosphere_mapping()，Harness 自动扫描 5 类氛围组件的可用属性，
  通过 MiMo 筛选氛围相关属性并按 9 维度（亮度/对比度/色温/色调偏移/
  饱和度/大气密度/阴影方向/天空/视角方向）分类。映射以 Markdown 表格形式直接返回。

  **映射表返回的 refPath 已可直接用于 get_properties / set_properties，**
  **无需再手动调 find_actors 查找组件。** 如需手动查找（如扫描可能遗漏的组件）：
    find_actors({"glob": "*Light*", "tag": ""}) → 名称包含 Light 的 Actor
    find_actors({"glob": "*Fog*", "tag": ""})   → 名称包含 Fog 的 Actor
    注意: tag 为必填参数，传空字符串 "" 匹配所有 Tag（非类名匹配）。
          Actor 通常没有 Tag 组件，因此 tag="" 是常态。glob 做名称模糊匹配。

  ### Step 2 — 加载参考图并对比
  调 match_reference("<path>")，返回 9 维度方向性差异清单 + 5 项量化指标。
  **记下色温 R/B 比值**——参考图和当前场景各有一个数。后续每轮调整都要对比这个值。

  ### Step 3 — 逐组件调整（按此顺序：先独立，后联动）
  从 match_reference 的差异清单和 Step 1 的映射表中，确定要调的组件和属性。
  **调整顺序很重要：** 先调独立组件（雾、体积云），再调会"染色"全局的组件（天空大气、方向光）。

  对每个组件：
    a. 调 get_properties 获取当前值
    b. 根据差异方向调整属性（参考映射表中的属性名和维度标注）
    c. 调 set_properties 写入
    d. 调 match_reference("<path>") 获取新的量化指标（R/B 比值、亮度、饱和度）
       **以量化指标为准判断方向。**
       - R/B 比值向参考值收敛 → 方向正确，下一个组件
       - R/B 比值偏离参考值 → 方向错误，反向调整，回到 b
       - 指标无明显变化 → 换属性或加大幅度，回到 b

  ### Step 4 — 整体确认
  全部组件调整完成且量化指标接近参考值后，调 vision_screenshot 确认整体效果。
  如仍有偏差，回到 Step 3 微调。

  ### 相机定位（截图前置）
  - **优先用 FocusOnActors**：找出场景中最大的 StaticMeshActor/Landscape，
    调 FocusOnActors 让相机对准它。这比重算 camera position 更可靠。
  - **不要手动 SetCameraTransform** 除非 Vision 明确说"视角太近/太远/被遮挡"。
  - **如果 Vision 返回"场景为空/看不到几何体"**：不要继续调属性！
    先用 GetCameraTransform 查看当前位置，然后用 FocusOnActors 重新对准。
    确认截图可见后再回 Step 3。

  ### 提示
  - match_reference 每次返回量化指标（R/B、亮度、饱和度）——这是最可靠的调整指南针。
    量化指标是确定性像素计算，不受 VLM 主观判断影响。
    **MiMo 分析与量化指标方向一致 → 高置信；不一致 → 以量化指标为准。**
  - 每轮调用 match_reference 自动截图，无需手动 vision_screenshot。
  - 每轮迭代后 L2 读回会自动确认写入值（ReadbackInterceptor 已在链中）
  - 多实例组件（>1 个）优先调整最可能影响整体的那一个
  - MiMo 9 维度差异提供整体方向参考，但具体每步调整以量化指标为导航
  - **收敛判断：** 每轮 match_reference 查看轮次信息中的倒计时提示。
    看到 ⏳ "剩余 N 次调整机会" → 倒计时中，优先调整影响最大的参数，勿浪费机会在微调上。
    看到 ⏳ "本轮为最后一次调整机会" → 本轮即为最终轮，调完后必须 deactivate_skill 退出。
    看到 🏆 新最佳记录 → 方向正确，继续。⚠ 低于最佳 → 考虑回退。🔴 连续下降 → 立即回退。
  - 连续 2 轮 match_reference 的直方图相似度、R/B 比值、饱和度变化幅度均 < 5%
    → 已收敛，调 deactivate_skill 退出。
  - 上述阈值为经验值。如初始偏差极大（如夜间 vs 白天），自行根据初始偏差大小放宽阈值。
