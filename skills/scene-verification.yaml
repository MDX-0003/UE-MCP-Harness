# 场景验证标准流程 Skill (Issue 015)
#
# 与 evening-lighting 不同，这是一个"元 Skill"——不描述具体的视觉目标，
# 而是描述"如何正确使用 Vision 工具验证场景修改"的标准操作规程。
#
# 双层引导机制：
#   软引导（始终生效）：SystemContextProvider 注入简版 SOP（get_context 始终可见）
#   硬引导（激活后生效）：本 Skill 注入完整步骤 + 过滤无关工具
#
# LLM 可通过 deactivate_skill 退出验证模式，回到自由探索。
name: scene-verification
description: "场景修改后的标准视觉验证流程：L2 读回 → 截图提问 → 追问确认 → 修正闭环"
triggers:
  - "验证"
  - "检查场景"
  - "确认修改"
  - "核实"
  - "看看效果"
  - "截图验证"
  - "视觉验证"
  - "verify"
  - "check the scene"
  - "确认一下"
  - "对不对"
  - "看一下"
  - "screenshot"
tools_allowlist:
  # ---- Vision 验证工具 ----
  - "vision_screenshot"
  - "vision_ask"
  - "vision_tell"
  - "vision_reset"
  - "vision_status"
  # ---- 读取/查询工具 ----
  - "ActorTools.get_actor_transform"
  - "ActorTools.get_actor_bounds"
  - "ActorTools.get_label"
  - "ActorTools.get_tags"
  - "ObjectTools.get_properties"
  - "ObjectTools.list_properties"
  - "SceneTools.find_actors"
  - "SceneTools.get_actors_in_folder"
  - "SceneTools.get_current_level"
  - "EditorAppToolset.GetCameraTransform"
  - "EditorAppToolset.GetSelectedActors"
  - "EditorAppToolset.GetVisibleActors"
  # ---- 常用修改工具（闭环中修正用）----
  - "ActorTools.set_actor_transform"
  - "ActorTools.set_label"
  - "ActorTools.add_tag"
  - "ActorTools.remove_tag"
  - "ObjectTools.set_properties"
  - "SceneTools.add_to_scene_from_class"
  - "SceneTools.add_to_scene_from_asset"
  - "SceneTools.remove_from_scene"
  # ---- 相机定位（截图前置）----
  - "EditorAppToolset.SelectActors"
  - "EditorAppToolset.FocusOnActors"
  - "EditorAppToolset.SetCameraTransform"
  - "EditorAppToolset.GetCameraTransform"
steps: |
  场景修改后的标准视觉验证流程（详见 Base instruction 中的「通用验证 SOP」）。
  简版：L2 读回确认 → 相机定位（预设角度轮换） → vision_screenshot(具体提问) → vision_ask 追问 → vision_reset 闭环。

  灯光验证特别注意：在被照亮的表面上判断效果，不看编辑器图标颜色。

verification:
  type: screenshot
  expected: "场景修改后的视觉效果与预期一致。所有被修改的 Actor 位置、旋转、缩放、材质、光照均符合要求。"
  tolerance: 0.7
