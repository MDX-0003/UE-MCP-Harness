# 场景验证标准流程 Skill (Issue 015)
#
# 与 evening-lighting 不同，这是一个"元 Skill"——不描述具体的视觉目标，
# 而是描述"如何正确使用 Vision 工具验证场景修改"的标准操作规程。
#
# 双层引导机制：
#   软引导（始终生效）：SystemContextProvider 注入简版 SOP（get_context 始终可见）
#   硬引导（激活后生效）：本 Skill 注入完整步骤 + 过滤无关工具
#
# LLM 可通过 deactivate_skill 退出验证模式，回到自由探索。
name: scene-verification
description: "场景修改后的标准视觉验证流程：L2 读回 → 截图提问 → 追问确认 → 修正闭环"
triggers:
  - "验证"
  - "检查场景"
  - "确认修改"
  - "核实"
  - "看看效果"
  - "截图验证"
  - "视觉验证"
  - "verify"
  - "check the scene"
  - "确认一下"
  - "对不对"
  - "看一下"
  - "screenshot"
tools_allowlist:
  # ---- Vision 验证工具 ----
  - "vision_screenshot"
  - "vision_ask"
  - "vision_tell"
  - "vision_reset"
  - "vision_status"
  # ---- 读取/查询工具 ----
  - "ActorTools.get_actor_transform"
  - "ActorTools.get_actor_bounds"
  - "ActorTools.get_label"
  - "ActorTools.get_tags"
  - "ObjectTools.get_properties"
  - "ObjectTools.list_properties"
  - "SceneTools.find_actors"
  - "SceneTools.get_actors_in_folder"
  - "SceneTools.get_current_level"
  - "EditorAppToolset.GetCameraTransform"
  - "EditorAppToolset.GetSelectedActors"
  - "EditorAppToolset.GetVisibleActors"
  # ---- 常用修改工具（闭环中修正用）----
  - "ActorTools.set_actor_transform"
  - "ActorTools.set_label"
  - "ActorTools.add_tag"
  - "ActorTools.remove_tag"
  - "ObjectTools.set_properties"
  - "SceneTools.add_to_scene_from_class"
  - "SceneTools.add_to_scene_from_asset"
  - "SceneTools.remove_from_scene"
  # ---- 截图 ----
  - "EditorAppToolset.CaptureAssetImage"
  - "EditorAppToolset.CaptureEditorImage"
steps: |
  场景修改后，必须按顺序执行以下验证闭环。每步完成后才能进入下一步。

  ## Step 1 — L2 读回验证（数据层确认）
  调 get_actor_transform 或 get_properties 确认写入已在引擎内生效。
  - 对比你发出的写入参数与读回值
  - 数值一致 → 进入 Step 2
  - 数值不一致 → 修正后重新写入，再次读回

  ## Step 2 — 视觉截图 + 针对性提问（视觉层确认）
  调 vision_screenshot(question="你的具体验证问题")。

  提问规则（重要）：
  - ❌ 不要问"描述场景"或"现在是什么样子"
  - ✅ 问具体的、可验证的问题：
    - "{Actor名} 的位置/旋转是否与预期一致？"
    - "所有 {N} 个 {类型} 是否都在 {位置}？"
    - "{光源名} 的颜色/方向/强度是否符合 {描述}？"
    - "阴影方向是否为 {方向}？长度是否约为 {倍数} 倍？"
  - 利用系统自动注入的 dirty actor 信息（无需手动 vision_tell）

  Vision 返回 ✅ PASS → 进入 Step 4
  Vision 返回 ❌ FAIL → 进入 Step 3

  ## Step 3 — 追问细节（如需）
  如果 Vision 的 FAIL reason 不够具体，调 vision_ask(question="追问") 深入分析：
  - "具体是哪个 Actor 位置不对？偏差大约多少？"
  - "光照颜色偏差在哪个方向（太冷/太暖/太暗）？"
  - "与上一次截图相比，{Actor} 是否有变化？"
  获得足够信息后，根据 adjustment 建议修正，回到 Step 1。

  ## Step 4 — 闭环
  验证通过后，调 vision_reset() 关闭当前 Vision Session。
  如果还有下一个验证目标，重新从 Step 1 开始。

  ## 快捷提示
  - 大胆使用 vision_ask 追问——它不截新图，token 消耗极低
  - 系统会自动注入 dirty actor 和最近操作记录，你通常不需要手动调 vision_tell
  - 仅当你需要说明任务级意图时（如"目标是傍晚光照"），才调 vision_tell

verification:
  type: screenshot
  expected: "场景修改后的视觉效果与预期一致。所有被修改的 Actor 位置、旋转、缩放、材质、光照均符合要求。"
  tolerance: 0.7
