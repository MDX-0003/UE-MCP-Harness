[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-agent-harness"
version = "0.1.0"
description = "UE Agent Harness — MCP 中间层，连接 LLM 与 Unreal Engine 5.8 编辑器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "anthropic>=0.30.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-httpx>=0.30",
]

[project.scripts]
harness = "harness.cli:main"
branch-mark = "branch_mark.score:main"

[tool.setuptools.packages.find]
include = ["harness*", "branch_mark*"]

[tool.setuptools.package-data]
skills = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
